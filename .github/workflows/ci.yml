name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Strict validation (Node 26, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "npm"

      - name: Fresh install, strict typecheck, and tests
        run: node tests/validate-development.mjs

      - name: Verify validation did not change the lockfile
        run: git diff --exit-code -- package-lock.json
